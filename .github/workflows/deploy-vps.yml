name: Deploy backend na VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Executar deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
          script_stop: true
          command_timeout: 60m
          script: |
            set -e
            cd "${{ secrets.VPS_BACKEND_PATH }}"
            echo "[deploy] pwd=$(pwd)"

            git fetch
            git stash || true
            git pull origin main
            echo "[deploy] git OK"

            export PUPPETEER_CACHE_DIR="$(pwd)/.cache/puppeteer"
            npm i --legacy-peer-deps
            echo "[deploy] npm i OK (postinstall já instala o Chrome)"

            echo "[deploy] memória:"
            free -h || true
            export NODE_OPTIONS="--max-old-space-size=1536"

            # Heartbeat evita SIGTERM 143 por SSH ocioso durante nest build
            echo "[deploy] iniciando nest build..."
            npm run build > /tmp/iam-nest-build.log 2>&1 &
            BUILD_PID=$!
            while kill -0 "$BUILD_PID" 2>/dev/null; do
              echo "[deploy] nest build em andamento pid=$BUILD_PID $(date -u +%H:%M:%S)"
              sleep 20
            done
            set +e
            wait "$BUILD_PID"
            BUILD_EC=$?
            set -e
            echo "[deploy] --- nest build log (tail) ---"
            tail -n 80 /tmp/iam-nest-build.log || true
            if [ "$BUILD_EC" -ne 0 ]; then
              echo "[deploy] nest build falhou exit=$BUILD_EC"
              exit "$BUILD_EC"
            fi
            echo "[deploy] nest build OK"

            pkill -f 'iam-pdf-chrome-' 2>/dev/null || true
            pkill -f 'chrome-headless' 2>/dev/null || true

            echo "[deploy] smoke test do PDF..."
            node scripts/pdf-smoke.js

            pm2 restart all --update-env
            echo "[deploy] concluído"
